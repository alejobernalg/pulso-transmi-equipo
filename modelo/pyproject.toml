[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pulso-forecast"
version = "0.1.0"
description = "Modelo de pronóstico de demanda para Pulso TransMi (sin fuga de información)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
pulso-forecast = "pulso_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
