[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pulso-transmi"
version = "0.1.0"
description = "SDK estudiantil para el reto MLOps Pulso TransMi"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.28,<1",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5,<2"]
dev = ["pytest>=8,<9"]
pipeline = ["supabase>=2,<3", "joblib>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
