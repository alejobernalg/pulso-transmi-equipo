name: pulso-transmi-train

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluar y decidir sin escribir en Supabase"
        type: boolean
        default: false
      tolerance:
        description: "Puntos de accuracy que el candidato puede perder frente al champion sin bloquear la promoción"
        type: string
        default: "0.5"
      mode:
        description: "promote: decide la validación offline; shadow: decide el desempeño en vivo (4 ciclos)"
        type: choice
        options: [promote, shadow]
        default: promote
  # Activar cuando haya al menos una promoción manual validada:
  # schedule:
  #   - cron: "17 6 * * *"

concurrency:
  group: pulso-transmi-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar paquetes (SDK + pipeline + modelo)
        run: python -m pip install -e '.[pipeline]' -e ./modelo

      - name: Entrenar, comparar y promover
        env:
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # MLflow en DagsHub (opcional: sin la variable DAGSHUB_USER no se registra nada)
          MLFLOW_TRACKING_URI: ${{ vars.DAGSHUB_USER && format('https://dagshub.com/{0}/pulso-transmi-equipo.mlflow', vars.DAGSHUB_USER) || '' }}
          MLFLOW_TRACKING_USERNAME: ${{ vars.DAGSHUB_USER }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          python -m pulso_pipeline.train_and_promote ${{ inputs.dry_run && '--dry-run' || '' }} --tolerance ${{ inputs.tolerance || '0.5' }} --mode ${{ inputs.mode || 'promote' }}
