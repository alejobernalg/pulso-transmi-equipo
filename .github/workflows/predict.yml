name: pulso-transmi-predict

on:
  # La plataforma abre un ciclo por hora hacia el minuto :45 y lo cierra a las
  # :10. La corrida de :44 espera la apertura (ver _wait_for_cycle) y envía; las
  # de :49, :55 y :01 son respaldo si GitHub retrasa el cron. Minutos no redondos
  # a propósito: en :00/:10/... GitHub acumula más retraso.
  schedule:
    - cron: "44,49,55,1 * * * *"
  workflow_dispatch:

concurrency:
  group: pulso-transmi-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # esperas de ciclo (3 min) + cutoff (4 min) + instalación + respaldo
    permissions:
      contents: read
      actions: write  # el disparador lanza train.yml en modo sombra
      issues: write   # alerta cuando una corrida falla o entrega con el respaldo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar paquetes (SDK + pipeline + modelo)
        run: python -m pip install -e '.[pipeline]' -e ./modelo

      - name: Sincronizar, inferir y entregar
        env:
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m pulso_pipeline.submit_current_cycle

      - name: Alerta (fallo o envío de respaldo)
        if: failure() || hashFiles('degraded.txt') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DETAIL="$(cat degraded.txt 2>/dev/null || echo 'la corrida falló')"
          OPEN=$(gh issue list --label pipeline-alert --state open --json number -q '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$DETAIL — $RUN_URL"
          else
            gh label create pipeline-alert --color B60205 --force >/dev/null 2>&1 || true
            gh issue create --label pipeline-alert --title "Pipeline de predicción en riesgo" \
              --body "$DETAIL — $RUN_URL" --assignee "${{ github.repository_owner }}"
          fi

      - name: Leaderboard y reentrenamiento automático
        if: always()
        continue-on-error: true
        env:
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pulso_pipeline.shadow
