name: pulso-transmi-predict

on:
  # Desfasado de los minutos redondos (":00, :10, :20...") a propósito: ahí es
  # donde más workflows de todo GitHub programan su cron, y GitHub mismo
  # documenta que eso aumenta el retraso. Mismo cadencia de 10 min, sin la
  # congestión. (Confirmado en este repo: */10 tardó más de 2h en disparar
  # solo la primera vez.)
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

concurrency:
  group: pulso-transmi-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar paquetes (SDK + pipeline + modelo)
        run: python -m pip install -e '.[pipeline]' -e ./modelo

      - name: Sincronizar, inferir y entregar
        env:
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m pulso_pipeline.submit_current_cycle
